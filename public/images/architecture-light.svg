<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Arrow Markers: Muted Editorial Palette -->
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#606770"/>
    </marker>
    <marker id="arrow-sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#3b6e51"/>
    </marker>
    <marker id="arrow-terracotta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#a0523d"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#4d6175"/>
    </marker>

    <!-- Subtle Editorial Elevation -->
    <filter id="shadow-editorial" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1a1c20" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
  </style>

  <!-- Background Canvas: Warm Paper Tone -->
  <rect width="960" height="520" fill="#f9f9fa" rx="10"/>

  <!-- ========================================== -->
  <!-- ZONE 1: INGRESS & SECURITY BOUNDARY (Left) -->
  <!-- ========================================== -->
  <rect x="24" y="28" width="220" height="464" rx="8" fill="#f4f5f7" stroke="#dcdfe4" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="36" y="21" width="168" height="16" rx="3" fill="#f9f9fa"/>
  <text x="120" y="33" fill="#656f7d" font-size="9.5" font-weight="700" letter-spacing="0.08em" text-anchor="middle" class="font-mono">INGRESS BOUNDARY</text>

  <!-- Node: Minecraft Server -->
  <g transform="translate(44, 60)" filter="url(#shadow-editorial)">
    <rect width="180" height="96" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#697d91"/>
    <text x="16" y="25" fill="#24292f" font-size="12.5" font-weight="600" class="font-sans">Minecraft Game Server</text>
    <text x="16" y="42" fill="#747f8d" font-size="9.5" class="font-mono">PaperMC 1.20.4+ Plugin</text>
    <rect x="16" y="56" width="148" height="24" rx="4" fill="#eef2f6"/>
    <text x="90" y="72" fill="#4b5d6f" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Tailscale WireGuard</text>
  </g>

  <!-- Node: Web Client / Staff -->
  <g transform="translate(44, 210)" filter="url(#shadow-editorial)">
    <rect width="180" height="96" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#8c95a0"/>
    <text x="16" y="25" fill="#24292f" font-size="12.5" font-weight="600" class="font-sans">Web Portal Client</text>
    <text x="16" y="42" fill="#747f8d" font-size="9.5" class="font-mono">Staff &amp; Users / Browser</text>
    <rect x="16" y="56" width="148" height="24" rx="4" fill="#f0f2f5"/>
    <text x="90" y="72" fill="#57606a" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Cloudflare Proxy (CDN)</text>
  </g>

  <!-- Node: Discord Gateway -->
  <g transform="translate(44, 360)" filter="url(#shadow-editorial)">
    <rect width="180" height="96" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#7a829e"/>
    <text x="16" y="25" fill="#24292f" font-size="12.5" font-weight="600" class="font-sans">Discord Gateway</text>
    <text x="16" y="42" fill="#747f8d" font-size="9.5" class="font-mono">WSS WebSocket Events</text>
    <rect x="16" y="56" width="148" height="24" rx="4" fill="#f2f3f8"/>
    <text x="90" y="72" fill="#626a88" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Heartbeat (50ms)</text>
  </g>


  <!-- ======================================================= -->
  <!-- ZONE 2: GCP COMPUTE ENGINE (Single Node · 1GB RAM Limit) -->
  <!-- ======================================================= -->
  <rect x="270" y="28" width="410" height="464" rx="8" fill="#f6f7f9" stroke="#d5d8df" stroke-width="1"/>
  <rect x="286" y="21" width="280" height="16" rx="3" fill="#f9f9fa"/>
  <text x="426" y="33" fill="#24292f" font-size="9.5" font-weight="700" letter-spacing="0.08em" text-anchor="middle" class="font-mono">GCP VM (SINGLE NODE · 1GB RAM)</text>

  <!-- Sub-block: FastAPI Web -->
  <g transform="translate(290, 60)" filter="url(#shadow-editorial)">
    <rect width="370" height="74" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <text x="16" y="23" fill="#24292f" font-size="12.5" font-weight="600" class="font-sans">FastAPI Server</text>
    <text x="110" y="23" fill="#747f8d" font-size="10" class="font-mono">Pure ASGI · Jinja2 SSR</text>
    <text x="16" y="44" fill="#57606a" font-size="10.5" class="font-sans">Security Headers 6종 주입 · Client IP Rate Limiter</text>
    <text x="16" y="60" fill="#747f8d" font-size="9.5" class="font-mono">SlowAPI + Redis Backed · CSRF Origin Check</text>
  </g>

  <!-- Sub-block: discord.py Bot & Event Loop -->
  <g transform="translate(290, 154)" filter="url(#shadow-editorial)">
    <rect width="370" height="110" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <text x="16" y="23" fill="#24292f" font-size="12.5" font-weight="600" class="font-sans">discord.py Bot Process</text>
    <text x="180" y="23" fill="#3b6e51" font-size="9.5" font-weight="600" class="font-mono">[Asyncio Event Loop]</text>
    
    <!-- ThreadPool Isolation Box: Pastel Terracotta -->
    <rect x="16" y="38" width="338" height="56" rx="5" fill="#fcf6f3" stroke="#e0c2b7" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="28" y="56" fill="#a0523d" font-size="11" font-weight="600" class="font-sans">ThreadPoolExecutor (max_workers=20)</text>
    <text x="28" y="72" fill="#57606a" font-size="9.5" class="font-sans">동기 DB I/O 격리 위임 (asyncio.to_thread)</text>
    <text x="28" y="86" fill="#3b6e51" font-size="9" font-weight="600" class="font-mono">&#x25C6; Gateway Lag 206ms &#x2192; 14.6ms (-92.9% 동결 차단)</text>
  </g>

  <!-- Sub-block: Redis In-Memory State & Broker -->
  <g transform="translate(290, 284)" filter="url(#shadow-editorial)">
    <rect width="370" height="188" rx="6" fill="#ffffff" stroke="#b2ccbb" stroke-width="1.2"/>
    <rect x="0" y="0" width="370" height="28" rx="5" fill="#f1f6f3"/>
    <text x="16" y="19" fill="#2d5940" font-size="12.5" font-weight="600" class="font-sans">Redis 7 (In-Memory State Broker)</text>
    <text x="250" y="19" fill="#3b6e51" font-size="9.5" font-weight="700" class="font-mono">[16.18ms Fast Path]</text>

    <!-- Fast Path Caching -->
    <rect x="16" y="38" width="338" height="40" rx="5" fill="#fafbfb" stroke="#e3e6ea" stroke-width="1"/>
    <text x="28" y="55" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">O(1) User / Job Cache (Pre-warmed)</text>
    <text x="28" y="69" fill="#3b6e51" font-size="9.5" font-weight="600" class="font-mono">DB I/O 0회 바이패스 &#x2192; 평균 레이턴시 16.18ms (-96.0%)</text>

    <!-- Distributed Lock -->
    <rect x="16" y="86" width="338" height="40" rx="5" fill="#fafbfb" stroke="#e3e6ea" stroke-width="1"/>
    <text x="28" y="103" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">Safe TTL (15s) Distributed Lock</text>
    <text x="28" y="117" fill="#57606a" font-size="9.5" class="font-mono">SET NX EX 15s &#x2192; 20건 동시 경합 중 Race Condition 0.0%</text>

    <!-- Pub/Sub Event Relay -->
    <rect x="16" y="134" width="338" height="40" rx="5" fill="#fafbfb" stroke="#e3e6ea" stroke-width="1"/>
    <text x="28" y="151" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">Pub/Sub Cross-Platform Relay</text>
    <text x="28" y="165" fill="#57606a" font-size="9.5" class="font-mono">Minecraft &#x2194; Discord 실시간 이벤트 전파 &amp; 무상태 동기화</text>
  </g>


  <!-- ======================================================== -->
  <!-- ZONE 3: DATABASE & LATENCY BOUNDARY (Supabase KR Region) -->
  <!-- ======================================================== -->
  <rect x="710" y="28" width="226" height="464" rx="8" fill="#f8f5f4" stroke="#e6cfc7" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="724" y="21" width="198" height="16" rx="3" fill="#f9f9fa"/>
  <text x="823" y="33" fill="#9b4e39" font-size="9.5" font-weight="700" letter-spacing="0.08em" text-anchor="middle" class="font-mono">SUPABASE KR (RTT 200ms)</text>

  <!-- Node: Self-healing Connection Pool -->
  <g transform="translate(724, 60)" filter="url(#shadow-editorial)">
    <rect width="198" height="150" rx="6" fill="#ffffff" stroke="#d9b6aa" stroke-width="1.2"/>
    <rect x="0" y="0" width="198" height="26" rx="5" fill="#fbf3f0"/>
    <text x="14" y="18" fill="#9b4e39" font-size="11.5" font-weight="600" class="font-sans">자가 치유 커넥션 풀</text>
    
    <text x="14" y="45" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">@db_retry 데코레이터</text>
    <text x="14" y="58" fill="#747f8d" font-size="9" class="font-mono">원격 소켓 강제 종료 100% 복구</text>
    
    <text x="14" y="80" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">SELECT 1 안티패턴 제거</text>
    <text x="14" y="93" fill="#747f8d" font-size="9" class="font-mono">RTT 200ms 사전 질의 누적 차단</text>

    <text x="14" y="115" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">TCP Keepalive 설정</text>
    <text x="14" y="128" fill="#3b6e51" font-size="9" font-weight="600" class="font-mono">&#x25C6; 레이턴시 405ms &#x2192; 243ms (-40%)</text>
  </g>

  <!-- Node: PostgreSQL Database -->
  <g transform="translate(724, 250)" filter="url(#shadow-editorial)">
    <rect width="198" height="150" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <text x="14" y="24" fill="#24292f" font-size="12.5" font-weight="600" class="font-sans">PostgreSQL 15 (DB)</text>
    <text x="14" y="41" fill="#747f8d" font-size="9.5" class="font-mono">Single Source of Truth</text>

    <rect x="14" y="54" width="170" height="36" rx="4" fill="#fafbfb" stroke="#e3e6ea" stroke-width="1"/>
    <text x="24" y="69" fill="#24292f" font-size="10" font-weight="600" class="font-sans">ON CONFLICT DO UPDATE</text>
    <text x="24" y="82" fill="#747f8d" font-size="8.5" class="font-mono">멱등성 보장 벌크 UPSERT</text>

    <rect x="14" y="98" width="170" height="36" rx="4" fill="#fafbfb" stroke="#e3e6ea" stroke-width="1"/>
    <text x="24" y="113" fill="#24292f" font-size="10" font-weight="600" class="font-sans">사후 상태 대사 (Reconcile)</text>
    <text x="24" y="126" fill="#747f8d" font-size="8.5" class="font-mono">봇 순단 시 누락 데이터 동기화</text>
  </g>


  <!-- ============================================== -->
  <!-- CONNECTORS (Orthogonal Right-Angle Connections) -->
  <!-- ============================================== -->
  
  <!-- Minecraft -> Redis (Pub/Sub WireGuard) -->
  <path d="M 224 108 H 257 Q 265 108 265 116 V 360 Q 265 368 273 368 H 290" fill="none" stroke="#697d91" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
  
  <!-- Web Client -> FastAPI -->
  <path d="M 224 258 H 257 Q 265 258 265 250 V 97 Q 265 97 273 97 H 290" fill="none" stroke="#8c95a0" stroke-width="1.1" marker-end="url(#arrow-neutral)"/>

  <!-- Discord Gateway -> Bot Event Loop -->
  <path d="M 224 408 H 257 Q 265 408 265 400 V 209 Q 265 209 273 209 H 290" fill="none" stroke="#7a829e" stroke-width="1.1" marker-end="url(#arrow-neutral)"/>

  <!-- Bot Event Loop -> Redis (FAST PATH: 16.18ms, Sage Tone) -->
  <path d="M 475 264 V 276 Q 475 284 475 284" fill="none" stroke="#3b6e51" stroke-width="1.6" marker-end="url(#arrow-sage)"/>

  <!-- ThreadPool -> Supabase Pool (SLOW PATH: 243.41ms RTT Boundary, Terracotta) -->
  <path d="M 660 216 H 685 Q 692 216 692 208 V 135 Q 692 135 700 135 H 724" fill="none" stroke="#a0523d" stroke-width="1.6" marker-end="url(#arrow-terracotta)"/>

  <!-- Connection Pool -> PostgreSQL Engine -->
  <path d="M 823 210 V 242" fill="none" stroke="#a0523d" stroke-width="1.2" marker-end="url(#arrow-terracotta)"/>

  <!-- Redis Reconcile Link with DB (Dashed) -->
  <path d="M 660 380 H 685 Q 692 380 692 370 V 325 Q 692 325 700 325 H 724" fill="none" stroke="#8c95a0" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-neutral)"/>

  <!-- Path Badges: Soft Pastel Tags -->
  <g transform="translate(485, 269)">
    <rect width="90" height="16" rx="3" fill="#eaf2ec" stroke="#b6d3be" stroke-width="0.8"/>
    <text x="45" y="12" fill="#2d5940" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">FAST PATH 16ms</text>
  </g>
  <g transform="translate(642, 171)">
    <rect width="104" height="16" rx="3" fill="#fbf2ef" stroke="#e0c2b7" stroke-width="0.8"/>
    <text x="52" y="12" fill="#9b4e39" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">SLOW PATH 243ms</text>
  </g>

</svg>
