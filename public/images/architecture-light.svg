<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-fast" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-slow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2e5aa8"/>
    </marker>

    <!-- Filters for subtle elevation -->
    <filter id="shadow-light" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2d3142" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="520" fill="#f8f9fa" rx="12"/>

  <!-- ========================================== -->
  <!-- ZONE 1: INGRESS & SECURITY BOUNDARY (Left) -->
  <!-- ========================================== -->
  <rect x="24" y="28" width="220" height="464" rx="10" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="36" y="20" width="168" height="18" rx="4" fill="#f8f9fa"/>
  <text x="120" y="33" fill="#4f5d75" font-size="10" font-weight="700" letter-spacing="0.1em" text-anchor="middle" class="font-mono">INGRESS BOUNDARY</text>

  <!-- Node: Minecraft Server -->
  <g transform="translate(44, 60)" filter="url(#shadow-light)">
    <rect width="180" height="96" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="96" rx="3" fill="#2e5aa8"/>
    <text x="18" y="26" fill="#2d3142" font-size="13" font-weight="700" class="font-sans">Minecraft Game Server</text>
    <text x="18" y="44" fill="#7a8399" font-size="10" class="font-mono">PaperMC 1.20.4+ Plugin</text>
    <rect x="18" y="56" width="144" height="26" rx="4" fill="rgba(46,90,168,0.08)"/>
    <text x="90" y="73" fill="#2e5aa8" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">Tailscale WireGuard</text>
  </g>

  <!-- Node: Web Client / Staff -->
  <g transform="translate(44, 210)" filter="url(#shadow-light)">
    <rect width="180" height="96" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="96" rx="3" fill="#4f5d75"/>
    <text x="18" y="26" fill="#2d3142" font-size="13" font-weight="700" class="font-sans">Web Portal Client</text>
    <text x="18" y="44" fill="#7a8399" font-size="10" class="font-mono">Staff &amp; Users / Browser</text>
    <rect x="18" y="56" width="144" height="26" rx="4" fill="rgba(79,93,117,0.08)"/>
    <text x="90" y="73" fill="#4f5d75" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">Cloudflare Proxy (CDN)</text>
  </g>

  <!-- Node: Discord Gateway -->
  <g transform="translate(44, 360)" filter="url(#shadow-light)">
    <rect width="180" height="96" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="96" rx="3" fill="#5865F2"/>
    <text x="18" y="26" fill="#2d3142" font-size="13" font-weight="700" class="font-sans">Discord Gateway</text>
    <text x="18" y="44" fill="#7a8399" font-size="10" class="font-mono">WSS WebSocket Events</text>
    <rect x="18" y="56" width="144" height="26" rx="4" fill="rgba(88,101,242,0.08)"/>
    <text x="90" y="73" fill="#5865F2" font-size="10" font-weight="600" text-anchor="middle" class="font-mono">Heartbeat (50ms)</text>
  </g>


  <!-- ======================================================= -->
  <!-- ZONE 2: GCP COMPUTE ENGINE (Single Node · 1GB RAM Limit) -->
  <!-- ======================================================= -->
  <rect x="270" y="28" width="410" height="464" rx="10" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="1.2"/>
  <rect x="286" y="20" width="280" height="18" rx="4" fill="#f8f9fa"/>
  <text x="426" y="33" fill="#2d3142" font-size="10" font-weight="700" letter-spacing="0.1em" text-anchor="middle" class="font-mono">GCP VM (SINGLE NODE · 1GB RAM)</text>

  <!-- Sub-block: FastAPI Web -->
  <g transform="translate(290, 60)" filter="url(#shadow-light)">
    <rect width="370" height="74" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
    <text x="18" y="24" fill="#2d3142" font-size="13" font-weight="700" class="font-sans">FastAPI Server</text>
    <text x="120" y="24" fill="#7a8399" font-size="11" class="font-mono">Pure ASGI · Jinja2 SSR</text>
    <text x="18" y="46" fill="#4f5d75" font-size="11" class="font-sans">Security Headers 6종 주입 · Client IP Rate Limiter</text>
    <text x="18" y="62" fill="#7a8399" font-size="10" class="font-mono">SlowAPI + Redis Backed · CSRF Origin Check</text>
  </g>

  <!-- Sub-block: discord.py Bot & Event Loop -->
  <g transform="translate(290, 154)" filter="url(#shadow-light)">
    <rect width="370" height="110" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
    <text x="18" y="24" fill="#2d3142" font-size="13" font-weight="700" class="font-sans">discord.py Bot Process</text>
    <text x="185" y="24" fill="#2e7d32" font-size="10" font-weight="600" class="font-mono">[Asyncio Event Loop]</text>
    
    <!-- ThreadPool Isolation Box -->
    <rect x="18" y="40" width="334" height="54" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="30" y="58" fill="#eb6c36" font-size="11" font-weight="700" class="font-sans">ThreadPoolExecutor (max_workers=20)</text>
    <text x="30" y="74" fill="#4f5d75" font-size="10" class="font-sans">동기 DB I/O 격리 위임 (asyncio.to_thread)</text>
    <text x="30" y="88" fill="#2e7d32" font-size="9" font-weight="700" class="font-mono">&#x25C6; Gateway Lag 206ms &#x2192; 14.6ms (-92.9% 동결 차단)</text>
  </g>

  <!-- Sub-block: Redis In-Memory State & Broker -->
  <g transform="translate(290, 284)" filter="url(#shadow-light)">
    <rect width="370" height="188" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
    <rect x="0" y="0" width="370" height="30" rx="7" fill="rgba(46,125,50,0.1)"/>
    <text x="18" y="20" fill="#2e7d32" font-size="13" font-weight="700" class="font-sans">Redis 7 (In-Memory State Broker)</text>
    <text x="245" y="20" fill="#2e7d32" font-size="10" font-weight="700" class="font-mono">[16.18ms Fast Path]</text>

    <!-- Fast Path Caching -->
    <rect x="18" y="42" width="334" height="38" rx="6" fill="#f8f9fa" stroke="rgba(45,49,66,0.1)" stroke-width="1"/>
    <text x="30" y="58" fill="#2d3142" font-size="11" font-weight="700" class="font-sans">O(1) User / Job Cache (Pre-warmed)</text>
    <text x="30" y="72" fill="#2e7d32" font-size="10" font-weight="600" class="font-mono">DB I/O 0회 바이패스 &#x2192; 평균 레이턴시 16.18ms (-96.0%)</text>

    <!-- Distributed Lock -->
    <rect x="18" y="88" width="334" height="38" rx="6" fill="#f8f9fa" stroke="rgba(45,49,66,0.1)" stroke-width="1"/>
    <text x="30" y="104" fill="#2d3142" font-size="11" font-weight="700" class="font-sans">Safe TTL (15s) Distributed Lock</text>
    <text x="30" y="118" fill="#4f5d75" font-size="10" class="font-mono">SET NX EX 15s &#x2192; 20건 동시 경합 중 Race Condition 0.0%</text>

    <!-- Pub/Sub Event Relay -->
    <rect x="18" y="134" width="334" height="38" rx="6" fill="#f8f9fa" stroke="rgba(45,49,66,0.1)" stroke-width="1"/>
    <text x="30" y="150" fill="#2d3142" font-size="11" font-weight="700" class="font-sans">Pub/Sub Cross-Platform Relay</text>
    <text x="30" y="164" fill="#4f5d75" font-size="10" class="font-mono">Minecraft &#x2194; Discord 실시간 이벤트 전파 &amp; 무상태 동기화</text>
  </g>


  <!-- ======================================================== -->
  <!-- ZONE 3: DATABASE & LATENCY BOUNDARY (Supabase KR Region) -->
  <!-- ======================================================== -->
  <rect x="710" y="28" width="226" height="464" rx="10" fill="rgba(45,49,66,0.02)" stroke="rgba(235,108,54,0.3)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <rect x="724" y="20" width="198" height="18" rx="4" fill="#f8f9fa"/>
  <text x="823" y="33" fill="#eb6c36" font-size="10" font-weight="700" letter-spacing="0.08em" text-anchor="middle" class="font-mono">SUPABASE KR (RTT 200ms)</text>

  <!-- Node: Self-healing Connection Pool -->
  <g transform="translate(724, 60)" filter="url(#shadow-light)">
    <rect width="198" height="150" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1.5"/>
    <rect x="0" y="0" width="198" height="28" rx="7" fill="rgba(235,108,54,0.08)"/>
    <text x="14" y="19" fill="#eb6c36" font-size="12" font-weight="700" class="font-sans">자가 치유 커넥션 풀</text>
    
    <text x="14" y="46" fill="#2d3142" font-size="11" font-weight="600" class="font-sans">@db_retry 데코레이터</text>
    <text x="14" y="60" fill="#7a8399" font-size="9" class="font-mono">원격 소켓 강제 종료 100% 복구</text>
    
    <text x="14" y="82" fill="#2d3142" font-size="11" font-weight="600" class="font-sans">SELECT 1 안티패턴 제거</text>
    <text x="14" y="96" fill="#7a8399" font-size="9" class="font-mono">RTT 200ms 사전 질의 누적 차단</text>

    <text x="14" y="118" fill="#2d3142" font-size="11" font-weight="600" class="font-sans">TCP Keepalive 설정</text>
    <text x="14" y="132" fill="#2e7d32" font-size="9" font-weight="700" class="font-mono">&#x25C6; 레이턴시 405ms &#x2192; 243ms (-40%)</text>
  </g>

  <!-- Node: PostgreSQL Database -->
  <g transform="translate(724, 250)" filter="url(#shadow-light)">
    <rect width="198" height="150" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
    <text x="14" y="24" fill="#2d3142" font-size="13" font-weight="700" class="font-sans">PostgreSQL 15 (DB)</text>
    <text x="14" y="42" fill="#7a8399" font-size="10" class="font-mono">Single Source of Truth</text>

    <rect x="14" y="54" width="170" height="36" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
    <text x="24" y="69" fill="#2d3142" font-size="10" font-weight="600" class="font-sans">ON CONFLICT DO UPDATE</text>
    <text x="24" y="82" fill="#7a8399" font-size="9" class="font-mono">멱등성 보장 벌크 UPSERT</text>

    <rect x="14" y="98" width="170" height="36" rx="4" fill="#f8f9fa" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
    <text x="24" y="113" fill="#2d3142" font-size="10" font-weight="600" class="font-sans">사후 상태 대사 (Reconcile)</text>
    <text x="24" y="126" fill="#7a8399" font-size="9" class="font-mono">봇 순단 시 누락 데이터 동기화</text>
  </g>


  <!-- ============================================== -->
  <!-- CONNECTORS (Orthogonal Right-Angle Connections) -->
  <!-- ============================================== -->
  
  <!-- Minecraft -> Redis (Pub/Sub WireGuard) -->
  <path d="M 224 108 H 257 Q 265 108 265 116 V 360 Q 265 368 273 368 H 290" fill="none" stroke="#2e5aa8" stroke-width="1.3" marker-end="url(#arrow-link)"/>
  
  <!-- Web Client -> FastAPI -->
  <path d="M 224 258 H 257 Q 265 258 265 250 V 97 Q 265 97 273 97 H 290" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-muted)"/>

  <!-- Discord Gateway -> Bot Event Loop -->
  <path d="M 224 408 H 257 Q 265 408 265 400 V 209 Q 265 209 273 209 H 290" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-muted)"/>

  <!-- Bot Event Loop -> Redis (FAST PATH: 16.18ms) -->
  <path d="M 475 264 V 276 Q 475 284 475 284" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-fast)"/>

  <!-- ThreadPool -> Supabase Pool (SLOW PATH: 243.41ms RTT Boundary) -->
  <path d="M 660 216 H 685 Q 692 216 692 208 V 135 Q 692 135 700 135 H 724" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-slow)"/>

  <!-- Connection Pool -> PostgreSQL Engine -->
  <path d="M 823 210 V 242" fill="none" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arrow-slow)"/>

  <!-- Redis Reconcile Link with DB (Dashed) -->
  <path d="M 660 380 H 685 Q 692 380 692 370 V 325 Q 692 325 700 325 H 724" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted)"/>

  <!-- Path Badges / Latency Indicators -->
  <g transform="translate(485, 268)">
    <rect width="96" height="18" rx="4" fill="#2e7d32"/>
    <text x="48" y="13" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle" class="font-mono">FAST PATH 16ms</text>
  </g>
  <g transform="translate(642, 170)">
    <rect width="112" height="18" rx="4" fill="#eb6c36"/>
    <text x="56" y="13" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle" class="font-mono">SLOW PATH 243ms</text>
  </g>

</svg>
