<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550" width="100%" height="100%">
  <defs>
    <!-- Arrow Markers: Muted Editorial Palette -->
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#606770"/>
    </marker>
    <marker id="arrow-sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#3b6e51"/>
    </marker>
    <marker id="arrow-terracotta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#a0523d"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#4d6175"/>
    </marker>

    <!-- Subtle Editorial Elevation -->
    <filter id="shadow-editorial" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1a1c20" flood-opacity="0.04"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
  </style>

  <!-- Background Canvas: Warm Paper Tone -->
  <rect width="980" height="550" fill="#f9f9fa" rx="10"/>

  <!-- ========================================== -->
  <!-- ZONE 1: INGRESS & SECURITY BOUNDARY (Left) -->
  <!-- ========================================== -->
  <rect x="20" y="24" width="210" height="500" rx="8" fill="#f4f5f7" stroke="#dcdfe4" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="32" y="16" width="160" height="16" rx="3" fill="#f9f9fa"/>
  <text x="112" y="28" fill="#656f7d" font-size="9" font-weight="700" letter-spacing="0.08em" text-anchor="middle" class="font-mono">INGRESS BOUNDARY</text>

  <!-- Node: Minecraft Server -->
  <g transform="translate(35, 52)" filter="url(#shadow-editorial)">
    <rect width="180" height="102" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="102" rx="2" fill="#697d91"/>
    <text x="16" y="25" fill="#24292f" font-size="12" font-weight="600" class="font-sans">Minecraft Game Server</text>
    <text x="16" y="42" fill="#747f8d" font-size="9.5" class="font-mono">PaperMC 1.20.4+ Plugin</text>
    <text x="16" y="58" fill="#57606a" font-size="9.5" class="font-sans">동접 최대 20명 인게임 이벤트</text>
    <rect x="16" y="68" width="148" height="22" rx="4" fill="#eef2f6"/>
    <text x="90" y="83" fill="#4b5d6f" font-size="9" font-weight="600" text-anchor="middle" class="font-mono">Tailscale WireGuard</text>
  </g>

  <!-- Node: Web Client / Staff -->
  <g transform="translate(35, 214)" filter="url(#shadow-editorial)">
    <rect width="180" height="102" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="102" rx="2" fill="#8c95a0"/>
    <text x="16" y="25" fill="#24292f" font-size="12" font-weight="600" class="font-sans">직업 위키 &amp; 웹 포털</text>
    <text x="16" y="42" fill="#747f8d" font-size="9.5" class="font-mono">90종 직업 열람 / 외부 유입</text>
    <text x="16" y="58" fill="#57606a" font-size="9.5" class="font-sans">뉴비 온보딩 &amp; 불특정 트래픽</text>
    <rect x="16" y="68" width="148" height="22" rx="4" fill="#f0f2f5"/>
    <text x="90" y="83" fill="#57606a" font-size="9" font-weight="600" text-anchor="middle" class="font-mono">Cloudflare Proxy (CDN)</text>
  </g>

  <!-- Node: Discord Gateway -->
  <g transform="translate(35, 376)" filter="url(#shadow-editorial)">
    <rect width="180" height="102" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="102" rx="2" fill="#7a829e"/>
    <text x="16" y="25" fill="#24292f" font-size="12" font-weight="600" class="font-sans">Discord Gateway</text>
    <text x="16" y="42" fill="#747f8d" font-size="9.5" class="font-mono">커뮤니티 40명 · WSS 소켓</text>
    <text x="16" y="58" fill="#57606a" font-size="9.5" class="font-sans">사유 승인/거절 View 인터랙션</text>
    <rect x="16" y="68" width="148" height="22" rx="4" fill="#f2f3f8"/>
    <text x="90" y="83" fill="#626a88" font-size="9" font-weight="600" text-anchor="middle" class="font-mono">Heartbeat (50ms)</text>
  </g>


  <!-- ======================================================= -->
  <!-- ZONE 2: GCP COMPUTE ENGINE (Single Node · 1GB RAM Limit) -->
  <!-- ======================================================= -->
  <rect x="270" y="24" width="410" height="500" rx="8" fill="#f6f7f9" stroke="#d5d8df" stroke-width="1"/>
  <rect x="286" y="16" width="280" height="16" rx="3" fill="#f9f9fa"/>
  <text x="426" y="28" fill="#24292f" font-size="9.5" font-weight="700" letter-spacing="0.08em" text-anchor="middle" class="font-mono">GCP VM (SINGLE NODE · 1GB RAM)</text>

  <!-- Sub-block: FastAPI Web -->
  <g transform="translate(290, 48)" filter="url(#shadow-editorial)">
    <rect width="370" height="78" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <text x="16" y="22" fill="#24292f" font-size="12" font-weight="600" class="font-sans">FastAPI Server (직업 위키 포털)</text>
    <text x="215" y="22" fill="#747f8d" font-size="9.5" class="font-mono">Jinja2 SSR</text>
    <text x="16" y="42" fill="#57606a" font-size="10" class="font-sans">90종 직업 상세 정보 SEO 최적화 · Security Headers 6종</text>
    <text x="16" y="60" fill="#747f8d" font-size="9" class="font-mono">Cloudflare cf-connecting-ip SlowAPI Rate Limiter 연동</text>
  </g>

  <!-- Sub-block: discord.py Bot & Event Loop -->
  <g transform="translate(290, 142)" filter="url(#shadow-editorial)">
    <rect width="370" height="124" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <text x="16" y="22" fill="#24292f" font-size="12" font-weight="600" class="font-sans">discord.py Bot Process</text>
    <text x="180" y="22" fill="#3b6e51" font-size="9.5" font-weight="600" class="font-mono">[Asyncio Event Loop]</text>
    
    <!-- ThreadPool Isolation Box: Pastel Terracotta -->
    <rect x="16" y="34" width="338" height="52" rx="5" fill="#fcf6f3" stroke="#e0c2b7" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="26" y="52" fill="#a0523d" font-size="10.5" font-weight="600" class="font-sans">ThreadPoolExecutor (max_workers=20)</text>
    <text x="26" y="68" fill="#57606a" font-size="9.5" class="font-sans">동기 DB I/O 격리 위임 (asyncio.to_thread)</text>

    <!-- Gateway Lag Metric -->
    <text x="16" y="104" fill="#3b6e51" font-size="9" font-weight="600" class="font-mono">&#x25C6; Gateway Lag 206ms &#x2192; 14.6ms (-92.9% 동결 차단)</text>
    <text x="16" y="117" fill="#656f7d" font-size="9" class="font-sans">&#x25C6; 디스코드 관리자 채널 도커 2000자 청크 로그 실시간 전파</text>
  </g>

  <!-- Sub-block: Redis In-Memory State & Broker -->
  <g transform="translate(290, 282)" filter="url(#shadow-editorial)">
    <rect width="370" height="226" rx="6" fill="#ffffff" stroke="#b2ccbb" stroke-width="1.2"/>
    <rect x="0" y="0" width="370" height="26" rx="5" fill="#f1f6f3"/>
    <text x="16" y="18" fill="#2d5940" font-size="12" font-weight="600" class="font-sans">Redis 7 (In-Memory State Broker)</text>
    <text x="250" y="18" fill="#3b6e51" font-size="9.5" font-weight="700" class="font-mono">[16.18ms Fast Path]</text>

    <!-- Fast Path Caching -->
    <rect x="16" y="34" width="338" height="54" rx="5" fill="#fafbfb" stroke="#e3e6ea" stroke-width="1"/>
    <text x="26" y="52" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">O(1) User / Job Cache (Pre-warmed)</text>
    <text x="26" y="67" fill="#57606a" font-size="9.5" class="font-sans">최대 90종 직업 데이터 및 유저 상태 인메모리 보관</text>
    <text x="26" y="80" fill="#3b6e51" font-size="9" font-weight="600" class="font-mono">DB I/O 0회 바이패스 &#x2192; 평균 레이턴시 16.18ms (-96.0%)</text>

    <!-- Distributed Lock -->
    <rect x="16" y="96" width="338" height="56" rx="5" fill="#fafbfb" stroke="#e3e6ea" stroke-width="1"/>
    <text x="26" y="114" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">Safe TTL (15s) Distributed Lock</text>
    <text x="26" y="129" fill="#57606a" font-size="9.5" class="font-sans">운영진 동시 승인/거절 클릭 시 레이스 컨디션 차단</text>
    <text x="26" y="143" fill="#3b6e51" font-size="9" font-weight="600" class="font-mono">SET NX EX 15s &#x2192; 20건 동시 경합 중 Race Condition 0.0%</text>

    <!-- Pub/Sub Event Relay -->
    <rect x="16" y="160" width="338" height="54" rx="5" fill="#fafbfb" stroke="#e3e6ea" stroke-width="1"/>
    <text x="26" y="178" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">Pub/Sub Cross-Platform Relay</text>
    <text x="26" y="193" fill="#57606a" font-size="9.5" class="font-sans">사유 우회(rpgsync:bypass_granted) 승인 실시간 통지</text>
    <text x="26" y="206" fill="#747f8d" font-size="9" class="font-mono">Minecraft &#x2194; Discord 무상태(Stateless) 이벤트 릴레이</text>
  </g>


  <!-- ======================================================== -->
  <!-- ZONE 3: DATABASE & LATENCY BOUNDARY (Supabase KR Region) -->
  <!-- ======================================================== -->
  <rect x="730" y="24" width="230" height="500" rx="8" fill="#f8f5f4" stroke="#e6cfc7" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="746" y="16" width="198" height="16" rx="3" fill="#f9f9fa"/>
  <text x="845" y="28" fill="#9b4e39" font-size="9" font-weight="700" letter-spacing="0.08em" text-anchor="middle" class="font-mono">SUPABASE KR (RTT 200ms)</text>

  <!-- Node: Self-healing Connection Pool -->
  <g transform="translate(745, 48)" filter="url(#shadow-editorial)">
    <rect width="200" height="162" rx="6" fill="#ffffff" stroke="#d9b6aa" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="26" rx="5" fill="#fbf3f0"/>
    <text x="14" y="18" fill="#9b4e39" font-size="11.5" font-weight="600" class="font-sans">자가 치유 커넥션 풀</text>
    
    <text x="14" y="46" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">@db_retry 데코레이터</text>
    <text x="14" y="60" fill="#747f8d" font-size="9" class="font-mono">원격 소켓 강제 종료 100% 복구</text>
    
    <text x="14" y="84" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">SELECT 1 안티패턴 제거</text>
    <text x="14" y="98" fill="#747f8d" font-size="9" class="font-mono">RTT 200ms 사전 질의 누적 차단</text>

    <text x="14" y="122" fill="#24292f" font-size="10.5" font-weight="600" class="font-sans">TCP Keepalive 설정</text>
    <text x="14" y="136" fill="#57606a" font-size="9" class="font-sans">유휴 연결 단절 방지 세션 유지</text>
    <text x="14" y="150" fill="#3b6e51" font-size="9" font-weight="600" class="font-mono">&#x25C6; 레이턴시 405ms &#x2192; 243ms (-40%)</text>
  </g>

  <!-- Node: PostgreSQL Database -->
  <g transform="translate(745, 230)" filter="url(#shadow-editorial)">
    <rect width="200" height="180" rx="6" fill="#ffffff" stroke="#d5d8de" stroke-width="1"/>
    <text x="14" y="24" fill="#24292f" font-size="12" font-weight="600" class="font-sans">PostgreSQL 15 (DB)</text>
    <text x="14" y="40" fill="#747f8d" font-size="9.5" class="font-mono">Single Source of Truth</text>

    <rect x="14" y="52" width="172" height="50" rx="4" fill="#fafbfb" stroke="#e3e6ea" stroke-width="1"/>
    <text x="22" y="68" fill="#24292f" font-size="9.5" font-weight="600" class="font-sans">ON CONFLICT DO UPDATE</text>
    <text x="22" y="82" fill="#747f8d" font-size="8.5" class="font-mono">멱등성 보장 벌크 UPSERT</text>
    <text x="22" y="94" fill="#57606a" font-size="8.5" class="font-sans">직업 90종 및 유저 정합성 보장</text>

    <rect x="14" y="112" width="172" height="56" rx="4" fill="#fafbfb" stroke="#e3e6ea" stroke-width="1"/>
    <text x="22" y="128" fill="#24292f" font-size="9.5" font-weight="600" class="font-sans">사후 상태 대사 (Reconcile)</text>
    <text x="22" y="142" fill="#747f8d" font-size="8.5" class="font-mono">봇 순단 시 누락 데이터 보정</text>
    <text x="22" y="156" fill="#57606a" font-size="8.5" class="font-sans">종료 시 콜드 아카이빙 (R2/dump)</text>
  </g>


  <!-- ===================================================== -->
  <!-- CONNECTORS (Separated Orthogonal Lines - Zero Overlap) -->
  <!-- ===================================================== -->
  
  <!-- Connector 1: Minecraft -> Redis (Pub/Sub WireGuard, X_mid = 246) -->
  <path d="M 215 103 H 242 Q 246 103 246 111 V 420 Q 246 428 254 428 H 290" fill="none" stroke="#697d91" stroke-width="1.2" marker-end="url(#arrow-slate)"/>
  
  <!-- Connector 2: Web Client -> FastAPI (X_mid = 254) -->
  <path d="M 215 265 H 250 Q 254 265 254 257 V 95 Q 254 87 262 87 H 290" fill="none" stroke="#8c95a0" stroke-width="1.1" marker-end="url(#arrow-neutral)"/>

  <!-- Connector 3: Discord Gateway -> Bot Event Loop (X_mid = 262) -->
  <path d="M 215 427 H 258 Q 262 427 262 419 V 212 Q 262 204 270 204 H 290" fill="none" stroke="#7a829e" stroke-width="1.1" marker-end="url(#arrow-neutral)"/>

  <!-- Internal Connector: Bot Event Loop -> Redis (FAST PATH) -->
  <path d="M 450 266 V 278" fill="none" stroke="#3b6e51" stroke-width="1.8" marker-end="url(#arrow-sage)"/>
  <g transform="translate(460, 267)">
    <rect width="84" height="15" rx="3" fill="#eaf2ec" stroke="#b6d3be" stroke-width="0.8"/>
    <text x="42" y="11" fill="#2d5940" font-size="8" font-weight="700" text-anchor="middle" class="font-mono">FAST PATH 16ms</text>
  </g>

  <!-- Connector 4: ThreadPool -> Supabase Pool (SLOW PATH, X_mid = 708) -->
  <path d="M 660 168 H 704 Q 708 168 708 160 V 129 Q 708 121 716 121 H 745" fill="none" stroke="#a0523d" stroke-width="1.8" marker-end="url(#arrow-terracotta)"/>
  <g transform="translate(670, 142)">
    <rect width="90" height="15" rx="3" fill="#fbf2ef" stroke="#e0c2b7" stroke-width="0.8"/>
    <text x="45" y="11" fill="#9b4e39" font-size="8" font-weight="700" text-anchor="middle" class="font-mono">SLOW PATH 243ms</text>
  </g>

  <!-- Connection Pool -> PostgreSQL Engine -->
  <path d="M 845 210 V 226" fill="none" stroke="#a0523d" stroke-width="1.3" marker-end="url(#arrow-terracotta)"/>

  <!-- Connector 5: Redis Reconcile Link with DB (Dashed, X_mid = 718) -->
  <path d="M 660 440 H 714 Q 718 440 718 432 V 338 Q 718 330 726 330 H 745" fill="none" stroke="#8c95a0" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-neutral)"/>

</svg>
