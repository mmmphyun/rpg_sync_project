<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550" width="100%" height="100%">
  <defs>
    <!-- Arrow Markers: Muted Dark Editorial Palette -->
    <marker id="arrow-neutral-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-sage-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#6ba583"/>
    </marker>
    <marker id="arrow-terracotta-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#cc7f66"/>
    </marker>
    <marker id="arrow-slate-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#7d93a8"/>
    </marker>

    <!-- Subtle Dark Mode Elevation -->
    <filter id="shadow-dark-editorial" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
  </style>

  <!-- Background Canvas: Charcoal Tone -->
  <rect width="980" height="550" fill="#13151a" rx="10"/>

  <!-- ========================================== -->
  <!-- ZONE 1: INGRESS & SECURITY BOUNDARY (Left) -->
  <!-- ========================================== -->
  <rect x="20" y="24" width="210" height="500" rx="8" fill="#181a21" stroke="#2a2e39" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="32" y="16" width="160" height="16" rx="3" fill="#13151a"/>
  <text x="112" y="28" fill="#8892a0" font-size="9" font-weight="700" letter-spacing="0.08em" text-anchor="middle" class="font-mono">INGRESS BOUNDARY</text>

  <!-- 1. Web Portal Client (Top - 1:1 with FastAPI) -->
  <g transform="translate(35, 48)" filter="url(#shadow-dark-editorial)">
    <rect width="180" height="78" rx="6" fill="#1e212b" stroke="#313644" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="78" rx="2" fill="#8b949e"/>
    <text x="16" y="22" fill="#e6edf3" font-size="12" font-weight="600" class="font-sans">직업 위키 &amp; 웹 클라이언트</text>
    <text x="16" y="38" fill="#8b949e" font-size="9.5" class="font-mono">90종 직업 열람 / 외부 유입</text>
    <rect x="16" y="48" width="148" height="20" rx="4" fill="#252933"/>
    <text x="90" y="62" fill="#a4afba" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Cloudflare Proxy (CDN)</text>
  </g>

  <!-- 2. Discord Gateway (Middle - 1:1 with discord.py) -->
  <g transform="translate(35, 154)" filter="url(#shadow-dark-editorial)">
    <rect width="180" height="100" rx="6" fill="#1e212b" stroke="#313644" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="100" rx="2" fill="#848bb0"/>
    <text x="16" y="24" fill="#e6edf3" font-size="12" font-weight="600" class="font-sans">Discord Gateway</text>
    <text x="16" y="40" fill="#8b949e" font-size="9.5" class="font-mono">커뮤니티 40명 · WSS 소켓</text>
    <text x="16" y="56" fill="#a4afba" font-size="9.5" class="font-sans">사유 승인/거절 View 인터랙션</text>
    <rect x="16" y="68" width="148" height="20" rx="4" fill="#252735"/>
    <text x="90" y="82" fill="#a0a8cf" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">Heartbeat (50ms)</text>
  </g>

  <!-- 3. Minecraft Game Server (Bottom - 1:1 with Redis) -->
  <g transform="translate(35, 340)" filter="url(#shadow-dark-editorial)">
    <rect width="180" height="100" rx="6" fill="#1e212b" stroke="#313644" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="100" rx="2" fill="#7d93a8"/>
    <text x="16" y="24" fill="#e6edf3" font-size="12" font-weight="600" class="font-sans">Minecraft Game Server</text>
    <text x="16" y="40" fill="#8b949e" font-size="9.5" class="font-mono">PaperMC 1.20.4+ Plugin</text>
    <text x="16" y="56" fill="#a4afba" font-size="9.5" class="font-sans">동접 최대 20명 인게임 이벤트</text>
    <rect x="16" y="68" width="148" height="20" rx="4" fill="#242936"/>
    <text x="90" y="82" fill="#9cb2c9" font-size="9" font-weight="600" text-anchor="middle" class="font-mono">Tailscale WireGuard</text>
  </g>


  <!-- ======================================================= -->
  <!-- ZONE 2: GCP COMPUTE ENGINE (Single Node · 1GB RAM Limit) -->
  <!-- ======================================================= -->
  <rect x="270" y="24" width="410" height="500" rx="8" fill="#181a22" stroke="#2e3340" stroke-width="1"/>
  <rect x="286" y="16" width="280" height="16" rx="3" fill="#13151a"/>
  <text x="426" y="28" fill="#e6edf3" font-size="9.5" font-weight="700" letter-spacing="0.08em" text-anchor="middle" class="font-mono">GCP VM (SINGLE NODE · 1GB RAM)</text>

  <!-- Sub-block 1: FastAPI Web (Top) -->
  <g transform="translate(290, 48)" filter="url(#shadow-dark-editorial)">
    <rect width="370" height="78" rx="6" fill="#1e212b" stroke="#313644" stroke-width="1"/>
    <text x="16" y="22" fill="#e6edf3" font-size="12" font-weight="600" class="font-sans">FastAPI Server (직업 위키 포털)</text>
    <text x="215" y="22" fill="#8b949e" font-size="9.5" class="font-mono">Jinja2 SSR</text>
    <text x="16" y="42" fill="#a4afba" font-size="10" class="font-sans">90종 직업 상세 정보 SEO 최적화 · Security Headers 6종</text>
    <text x="16" y="60" fill="#8b949e" font-size="9.5" class="font-mono">Cloudflare cf-connecting-ip SlowAPI Rate Limiter 연동</text>
  </g>

  <!-- Sub-block 2: discord.py Bot & Event Loop (Middle) -->
  <g transform="translate(290, 142)" filter="url(#shadow-dark-editorial)">
    <rect width="370" height="124" rx="6" fill="#1e212b" stroke="#313644" stroke-width="1"/>
    <text x="16" y="22" fill="#e6edf3" font-size="12" font-weight="600" class="font-sans">discord.py Bot Process</text>
    <text x="180" y="22" fill="#6ba583" font-size="9.5" font-weight="600" class="font-mono">[Asyncio Event Loop]</text>
    
    <!-- ThreadPool Isolation Box: Pastel Terracotta Dark -->
    <rect x="16" y="34" width="338" height="52" rx="5" fill="#261f1c" stroke="#523932" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="26" y="52" fill="#cc7f66" font-size="10.5" font-weight="600" class="font-sans">ThreadPoolExecutor (max_workers=20)</text>
    <text x="26" y="68" fill="#a4afba" font-size="9.5" class="font-sans">동기 DB I/O 격리 위임 (asyncio.to_thread)</text>

    <!-- Gateway Lag Metric -->
    <text x="16" y="104" fill="#6ba583" font-size="9" font-weight="600" class="font-mono">&#x25C6; Gateway Lag 206ms &#x2192; 14.6ms (-92.9% 동결 차단)</text>
    <text x="16" y="117" fill="#8892a0" font-size="9" class="font-sans">&#x25C6; 디스코드 관리자 채널 도커 2000자 청크 로그 실시간 전파</text>
  </g>

  <!-- Sub-block 3: Redis In-Memory State & Broker (Bottom) -->
  <g transform="translate(290, 282)" filter="url(#shadow-dark-editorial)">
    <rect width="370" height="226" rx="6" fill="#1e212b" stroke="#3a5445" stroke-width="1.2"/>
    <rect x="0" y="0" width="370" height="26" rx="5" fill="#1e2922"/>
    <text x="16" y="18" fill="#7db594" font-size="12" font-weight="600" class="font-sans">Redis 7 (In-Memory State Broker)</text>
    <text x="250" y="18" fill="#6ba583" font-size="9.5" font-weight="700" class="font-mono">[16.18ms Fast Path]</text>

    <!-- Fast Path Caching -->
    <rect x="16" y="34" width="338" height="54" rx="5" fill="#171920" stroke="#292d38" stroke-width="1"/>
    <text x="26" y="52" fill="#e6edf3" font-size="10.5" font-weight="600" class="font-sans">O(1) User / Job Cache (Pre-warmed)</text>
    <text x="26" y="67" fill="#a4afba" font-size="9.5" class="font-sans">최대 90종 직업 데이터 및 유저 상태 인메모리 보관</text>
    <text x="26" y="80" fill="#6ba583" font-size="9.5" font-weight="600" class="font-mono">DB I/O 0회 바이패스 &#x2192; 평균 레이턴시 16.18ms (-96.0%)</text>

    <!-- Distributed Lock -->
    <rect x="16" y="96" width="338" height="56" rx="5" fill="#171920" stroke="#292d38" stroke-width="1"/>
    <text x="26" y="114" fill="#e6edf3" font-size="10.5" font-weight="600" class="font-sans">Safe TTL (15s) Distributed Lock</text>
    <text x="26" y="129" fill="#a4afba" font-size="9.5" class="font-sans">운영진 동시 승인/거절 클릭 시 레이스 컨디션 차단</text>
    <text x="26" y="143" fill="#6ba583" font-size="9.5" font-weight="600" class="font-mono">SET NX EX 15s &#x2192; 20건 동시 경합 중 Race Condition 0.0%</text>

    <!-- Pub/Sub Event Relay -->
    <rect x="16" y="160" width="338" height="54" rx="5" fill="#171920" stroke="#292d38" stroke-width="1"/>
    <text x="26" y="178" fill="#e6edf3" font-size="10.5" font-weight="600" class="font-sans">Pub/Sub Cross-Platform Relay</text>
    <text x="26" y="193" fill="#a4afba" font-size="9.5" class="font-sans">사유 우회(rpgsync:bypass_granted) 승인 실시간 통지</text>
    <text x="26" y="206" fill="#8b949e" font-size="9" class="font-mono">Minecraft &#x2194; Discord 무상태(Stateless) 이벤트 릴레이</text>
  </g>


  <!-- ======================================================== -->
  <!-- ZONE 3: DATABASE & LATENCY BOUNDARY (Supabase KR Region) -->
  <!-- ======================================================== -->
  <rect x="730" y="24" width="230" height="500" rx="8" fill="#1d1917" stroke="#4d352e" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="746" y="16" width="198" height="16" rx="3" fill="#13151a"/>
  <text x="845" y="28" fill="#cc7f66" font-size="9.5" font-weight="700" letter-spacing="0.08em" text-anchor="middle" class="font-mono">SUPABASE KR (RTT 200ms)</text>

  <!-- Node: Self-healing Connection Pool -->
  <g transform="translate(745, 48)" filter="url(#shadow-dark-editorial)">
    <rect width="200" height="162" rx="6" fill="#1e212b" stroke="#523932" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="26" rx="5" fill="#281f1c"/>
    <text x="14" y="18" fill="#cc7f66" font-size="11.5" font-weight="600" class="font-sans">자가 치유 커넥션 풀</text>
    
    <text x="14" y="46" fill="#e6edf3" font-size="10.5" font-weight="600" class="font-sans">@db_retry 데코레이터</text>
    <text x="14" y="60" fill="#8b949e" font-size="9" class="font-mono">원격 소켓 강제 종료 100% 복구</text>
    
    <text x="14" y="84" fill="#e6edf3" font-size="10.5" font-weight="600" class="font-sans">SELECT 1 안티패턴 제거</text>
    <text x="14" y="98" fill="#8b949e" font-size="9" class="font-mono">RTT 200ms 사전 질의 누적 차단</text>

    <text x="14" y="122" fill="#e6edf3" font-size="10.5" font-weight="600" class="font-sans">TCP Keepalive 설정</text>
    <text x="14" y="136" fill="#a4afba" font-size="9.5" class="font-sans">유휴 연결 단절 방지 세션 유지</text>
    <text x="14" y="150" fill="#6ba583" font-size="9" font-weight="600" class="font-mono">&#x25C6; 레이턴시 405ms &#x2192; 243ms (-40%)</text>
  </g>

  <!-- Node: PostgreSQL Database -->
  <g transform="translate(745, 230)" filter="url(#shadow-dark-editorial)">
    <rect width="200" height="180" rx="6" fill="#1e212b" stroke="#313644" stroke-width="1"/>
    <text x="14" y="24" fill="#e6edf3" font-size="12" font-weight="600" class="font-sans">PostgreSQL 15 (DB)</text>
    <text x="14" y="40" fill="#8b949e" font-size="9.5" class="font-mono">Single Source of Truth</text>

    <rect x="14" y="52" width="172" height="50" rx="4" fill="#171920" stroke="#292d38" stroke-width="1"/>
    <text x="22" y="68" fill="#e6edf3" font-size="9.5" font-weight="600" class="font-sans">ON CONFLICT DO UPDATE</text>
    <text x="22" y="82" fill="#8b949e" font-size="8.5" class="font-mono">멱등성 보장 벌크 UPSERT</text>
    <text x="22" y="94" fill="#a4afba" font-size="8.5" class="font-sans">직업 90종 및 유저 정합성 보장</text>

    <rect x="14" y="112" width="172" height="56" rx="4" fill="#171920" stroke="#292d38" stroke-width="1"/>
    <text x="22" y="128" fill="#e6edf3" font-size="9.5" font-weight="600" class="font-sans">사후 상태 대사 (Reconcile)</text>
    <text x="22" y="142" fill="#8b949e" font-size="8.5" class="font-mono">봇 순단 시 누락 데이터 보정</text>
    <text x="22" y="156" fill="#a4afba" font-size="8.5" class="font-sans">종료 시 콜드 아카이빙 (R2/dump)</text>
  </g>


  <!-- ======================================================= -->
  <!-- CONNECTORS: Perfectly Parallel 1:1 Horizontal Routing   -->
  <!-- ======================================================= -->
  
  <!-- 1. Web Portal Client -> FastAPI (Perfect Horizontal Flow) -->
  <line x1="215" y1="87" x2="290" y2="87" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow-neutral-dark)"/>

  <!-- 2. Discord Gateway -> discord.py Bot (Perfect Horizontal Flow) -->
  <line x1="215" y1="204" x2="290" y2="204" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow-neutral-dark)"/>

  <!-- 3. Minecraft Server -> Redis (Direct Clean Horizontal Flow via Tailscale) -->
  <line x1="215" y1="390" x2="290" y2="390" stroke="#7d93a8" stroke-width="1.3" marker-end="url(#arrow-slate-dark)"/>

  <!-- Internal Connector: Bot Event Loop -> Redis (FAST PATH) -->
  <path d="M 450 266 V 278" fill="none" stroke="#6ba583" stroke-width="1.8" marker-end="url(#arrow-sage-dark)"/>
  <g transform="translate(460, 267)">
    <rect width="84" height="15" rx="3" fill="#1e2922" stroke="#3a5445" stroke-width="0.8"/>
    <text x="42" y="11" fill="#7db594" font-size="8" font-weight="700" text-anchor="middle" class="font-mono">FAST PATH 16ms</text>
  </g>

  <!-- Connector 4: ThreadPool -> Supabase Pool (SLOW PATH) -->
  <path d="M 660 168 H 704 Q 708 168 708 160 V 129 Q 708 121 716 121 H 745" fill="none" stroke="#cc7f66" stroke-width="1.8" marker-end="url(#arrow-terracotta-dark)"/>
  <g transform="translate(670, 142)">
    <rect width="90" height="15" rx="3" fill="#281f1c" stroke="#523932" stroke-width="0.8"/>
    <text x="45" y="11" fill="#cc7f66" font-size="8" font-weight="700" text-anchor="middle" class="font-mono">SLOW PATH 243ms</text>
  </g>

  <!-- Connection Pool -> PostgreSQL Engine -->
  <path d="M 845 210 V 226" fill="none" stroke="#cc7f66" stroke-width="1.3" marker-end="url(#arrow-terracotta-dark)"/>

  <!-- Connector 5: Redis Reconcile Link with DB (Dashed) -->
  <path d="M 660 440 H 714 Q 718 440 718 432 V 338 Q 718 330 726 330 H 745" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-neutral-dark)"/>

</svg>
