{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/index.css">
{% endblock %}

{% block content %}
<div class="index-layout">
    <!-- Hero Banner -->
    <section class="hero-section">
        <div class="swiper" id="hero-swiper" style="width: 100%; height: 100%;">
            <div class="swiper-wrapper" id="banner-wrapper">
                <!-- 초기 로딩 스켈레톤 UI -->
                <div class="swiper-slide skeleton" style="width: 100%; height: 100%;"></div>
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-prev" style="color: var(--accent-hero);"></div>
            <div class="swiper-button-next" style="color: var(--accent-hero);"></div>
        </div>
    </section>

    <!-- Quick Links -->
    <nav class="quick-links">
        <a href="/notice" class="quick-item">
            <div class="icon"><i class="ra ra-scroll-unfurled"></i></div>
            <span class="text">공지사항</span>
        </a>
        <a href="/event" class="quick-item">
            <div class="icon"><i class="ra ra-horn-call"></i></div>
            <span class="text">이벤트</span>
        </a>
        <a href="/jobs" class="quick-item">
            <div class="icon"><i class="ra ra-crossed-swords"></i></div>
            <span class="text">직업설명</span>
        </a>
        <a href="/tips" class="quick-item">
            <div class="icon"><i class="ra ra-key"></i></div>
            <span class="text">팁</span>
        </a>
    </nav>

    <!-- 3-Column Dashboard -->
    <section class="dashboard-grid">
        <article class="widget">
            <h3 class="widget-title">서버 상태</h3>
            <div id="server-status-content" class="widget-body"></div>
        </article>

        <article class="widget">
            <h3 class="widget-title">최근 업데이트</h3>
            <ul id="latest-posts" class="widget-body inner-scroll"></ul>
        </article>

        <article class="widget">
            <h3 class="widget-title">최근 리뷰</h3>
            <div id="recent-reviews" class="widget-body inner-scroll"></div>
        </article>
    </section>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/index.js"></script>
{% endblock %}
