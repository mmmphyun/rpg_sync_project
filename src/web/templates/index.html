{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="/static/index.css?v=1.0.1">
{% endblock %}

{% block content %}
<div class="index-layout">
    <!-- Hero Banner -->
    <section class="hero-section">
        <div class="swiper" id="hero-swiper" style="width: 100%; height: 100%;">
            <div class="swiper-wrapper" id="banner-wrapper">
                <!-- 초기 로딩 스켈레톤 UI -->
                <div class="swiper-slide skeleton" style="width: 100%; height: 100%;"></div>
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-prev" style="color: var(--accent-hero);"></div>
            <div class="swiper-button-next" style="color: var(--accent-hero);"></div>
        </div>
    </section>

    <!-- Quick Links -->
    <nav class="quick-links">
        <a href="/notice" class="quick-item">
            <div class="icon"><i class="ra ra-scroll-unfurled"></i></div>
            <span class="text">공지사항</span>
        </a>
        <a href="/event" class="quick-item">
            <div class="icon"><i class="ra ra-horn-call"></i></div>
            <span class="text">이벤트</span>
        </a>
        <a href="/jobs" class="quick-item">
            <div class="icon"><i class="ra ra-crossed-swords"></i></div>
            <span class="text">직업설명</span>
        </a>
        <a href="/tips" class="quick-item">
            <div class="icon"><i class="ra ra-key"></i></div>
            <span class="text">팁</span>
        </a>
    </nav>

    <!-- 3-Column Dashboard -->
    <section class="dashboard-grid">
        <article class="widget">
            <h3 class="widget-title">서버 상태</h3>
            <div id="server-status-content" class="widget-body"></div>
        </article>

        <article class="widget">
            <h3 class="widget-title">최근 업데이트</h3>
            <ul id="latest-posts" class="widget-body inner-scroll"></ul>
        </article>

        <article class="widget">
            <h3 class="widget-title">최근 리뷰</h3>
            <div id="recent-reviews" class="widget-body inner-scroll"></div>
        </article>
    </section>
</div>

<!-- Event Popup Modal -->
<div class="modal-overlay" id="eventPopupModal">
    <!-- 테마 일치화: .widget 클래스를 재사용하여 글래스모피즘 및 보더 컬러 적용 -->
    <div class="widget" style="padding: 0; overflow: hidden; width: 400px; max-width: 90%;">
        <div style="position: relative;" id="popupImageContainer">
            <!-- JS 렌더링 영역 -->
        </div>
        <div style="padding: 20px; background: rgba(11, 12, 26, 0.95);">
            <h3 id="popupTitle" style="color: var(--text-main); margin: 0 0 15px 0; font-size: 1.2rem; text-align: center; font-family: 'Jura', sans-serif;"></h3>

            <div style="display: flex; justify-content: space-between; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 15px;">
                <button onclick="closePopupForToday()" style="background: none; color: var(--text-muted); border: none; cursor: pointer; font-size: 0.85rem; transition: color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">오늘은 그만 보기</button>
                <button onclick="closePopupModal()" style="background: none; color: var(--accent-hero); border: none; cursor: pointer; font-size: 0.85rem; font-weight: bold; text-shadow: 0 0 5px rgba(0, 242, 254, 0.3); transition: text-shadow 0.2s;" onmouseover="this.style.textShadow='0 0 10px rgba(0,242,254,0.8)'" onmouseout="this.style.textShadow='0 0 5px rgba(0, 242, 254, 0.3)'">닫기</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/index.js?v=1.0.1"></script>
{% endblock %}
