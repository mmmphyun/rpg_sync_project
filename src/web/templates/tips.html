{% extends "base.html" %}

{% block title %}팁 게시판 - Fossile Wiki{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/tips.css">
{% endblock %}

{% block content %}
<div class="header-blur-backdrop"></div>

<div class="content-container tips-container">
    <div class="page-title-area">
        <button id="writeTipBtn" class="btn-primary" onclick="openWriteModal()" style="display: none;">
            <i class="ra ra-quill-ink"></i> 작성하기
        </button>
    </div>

    <!-- 비로그인 유저 블러 처리 및 오버레이 -->
    {% if not is_logged_in %}
    <div class="auth-overlay">
        <div class="auth-card">
            <i class="ra ra-locked overlay-icon"></i>
            <h2>접근 권한이 없습니다</h2>
            <p>디스코드 서버 입장 후 <strong>/위키</strong> 명령어로 로그인하세요.</p>
            <a href="https://discord.gg/jjqMWF5drb" target="_blank" class="btn-discord">
                <i class="ra ra-speech-bubble"></i> 디스코드 서버 입장하기
            </a>
        </div>
    </div>
    {% endif %}

    <!-- 게시판 메인 컨텐츠 -->
    <div id="tips-board" class="{% if not is_logged_in %}blur-content{% endif %}" data-logged-in="{{ 'true' if is_logged_in else 'false' }}">
        
        <div class="filter-bar">
            <button class="tag-btn active" data-category="BUILD">추천 빌드</button>
            <button class="tag-btn" data-category="GUILD">길드 모집</button>
            <button class="tag-btn" data-category="QNA">유저 포럼 (Q&A)</button>
        </div>

        <div id="feedArea" class="feed-area">
            <!-- JS 렌더링 영역 -->
        </div>

        <div id="paginationArea" class="pagination-area">
            <!-- 페이지네이션 렌더링 영역 -->
        </div>
    </div>
</div>

<!-- 작성/수정 모달 -->
<div class="modal-overlay" id="writeModal" style="display: none;">
    <div class="modal-content write-modal-content">
        <div class="modal-header">
            <h3>작성하기</h3>
            <button class="modal-close" onclick="closeWriteModal()">&times;</button>
        </div>
        <div class="write-form-group row">
            <select id="tipPrefixInput" class="form-input select-prefix">
                <option value="질문">질문</option>
                <option value="팁">팁</option>
                <option value="잡담">잡담</option>
            </select>
            <input type="text" id="tipTitleInput" class="form-input flex-grow" placeholder="제목을 입력하세요">
        </div>
        <div class="write-form-group">
            <textarea id="tipContentInput" class="form-input content-textarea" placeholder="본문 내용을 입력하세요 (마크다운 지원)"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeWriteModal()">취소</button>
            <button class="btn-primary" onclick="submitTip()">등록하기</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/tips.js"></script>
{% endblock %}
