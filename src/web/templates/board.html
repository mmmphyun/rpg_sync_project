<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ "공지사항" if board_type == "notice" else "이벤트" }} - Fossile Wiki</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="page-jobs"> <header class="dash-header">
    <div class="header-container">
        <h1 class="logo" onclick="location.href='/'">Fossile Wiki</h1>
        <div id="user-status-area" class="user-card-anchor"></div>
    </div>
</header>

<div class="content-container" style="max-width: 900px; margin: 0 auto; padding: 20px;">

    <div class="page-title-area" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="color: #fff; margin: 0;" id="boardTitle">
            {{ "공지사항" if board_type == "notice" else "이벤트" }}
        </h2>
    </div>

    {% if board_type == "notice" %}
    <div class="filter-bar" style="border-radius: 8px; margin-bottom: 20px;">
        <span class="filter-label">태그</span>
        <button class="filter-btn tag-btn active" data-tag="">전체 보기</button>
        <button class="filter-btn tag-btn" data-tag="일반 공지">일반 공지</button>
        <button class="filter-btn tag-btn" data-tag="직업 공지">직업 공지</button>
        <button class="filter-btn tag-btn" data-tag="서버 상태 공지">서버 상태 공지</button>
        <button class="filter-btn tag-btn" data-tag="시스템 공지">시스템 공지</button>
        <button class="filter-btn tag-btn" data-tag="업데이트">업데이트</button>
    </div>
    {% endif %}

    <div id="feedArea" style="display: flex; flex-direction: column; gap: 20px;">
        </div>

    <div id="paginationArea" style="display: flex; justify-content: center; gap: 8px; margin-top: 30px; padding-bottom: 40px;">
        </div>

</div>

<footer class="dash-footer">
    <div class="footer-container">
        <p>&copy; 2026 Fossile Wiki. All rights reserved.</p>
        <p class="attribution">아이디어 및 초기 소스 제공: 나나</p>
    </div>
</footer>

<div class="lightbox" id="lightbox"><img src="" alt=""></div>

<!-- 모달 -->
<div class="review-modal-overlay" id="tagModal">
    <div class="review-modal-content" style="width: 320px; padding: 20px;">
        <h3 style="color: #fff; margin-bottom: 15px; font-size: 1.1rem;">태그 변경</h3>
        <select id="newTagSelect" style="width: 100%; padding: 10px; margin-bottom: 20px; background: #0f0f15; color: #fff; border: 1px solid #333; border-radius: 4px; font-size: 0.9rem;">
            <option value="일반 공지">일반 공지</option>
            <option value="직업 공지">직업 공지</option>
            <option value="서버 상태 공지">서버 상태 공지</option>
            <option value="시스템 공지">시스템 공지</option>
            <option value="업데이트">업데이트</option>
        </select>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <button onclick="closeTagModal()" style="padding: 8px 16px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer;">취소</button>
            <button onclick="submitTagChange()" style="padding: 8px 16px; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">변경 적용</button>
        </div>
    </div>
</div>

<div class="review-modal-overlay" id="titleModal">
    <div class="review-modal-content" style="width: 350px;">
        <div class="review-modal-header">
            <h3>제목 수정</h3>
            <button class="review-modal-close" onclick="closeTitleModal()">&times;</button>
        </div>
        <div style="padding: 20px;">
            <input type="text" id="newTitleInput" placeholder="제목 입력 (비워두면 자동 요약)" style="width: 100%; padding: 10px; margin-bottom: 20px; background: #0f0f15; color: #fff; border: 1px solid #333; border-radius: 4px; box-sizing: border-box;">
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="closeTitleModal()" style="padding: 8px 16px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer;">취소</button>
                <button onclick="submitTitleChange()" style="padding: 8px 16px; background: #f39c12; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">변경 적용</button>
            </div>
        </div>
    </div>
</div>

<script>
  window.BOARD_TYPE = "{{ board_type }}";
</script>
<script src="/static/index.js?v=1.0.2"></script>
<script src="/static/board.js?v=1.0.6"></script>

</body>
</html>
