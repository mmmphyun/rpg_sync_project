services:
  db:
    image: postgres:15-alpine
    container_name: rpg-db-dev
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: rpg_dev_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - dev_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: rpg-redis-dev
    ports:
      - "6379:6379"
    env_file:
      - .env.dev
    command: redis-server --requirepass ${REDIS_PASSWORD}

  api:
    build: .
    container_name: rpg-api-dev
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env.dev
    volumes:
      - ./public:/app/public
      - ./src/web/templates:/app/src/web/templates
      - ./src:/app/src
    command: uvicorn src.web.main:app --host 0.0.0.0 --port 8000 --reload

  bot:
    build: .
    container_name: rpg-bot-dev
    depends_on:
      - db
      - redis
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src
    command: python -m src.bot.main

volumes:
  dev_db_data:
